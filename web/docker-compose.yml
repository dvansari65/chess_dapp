version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chessdapp_postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: chess_password_123
      POSTGRES_DB: chessdapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chessdapp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local